# Render.com blueprint — deploys the Django API and the React static site.
# Docs: https://render.com/docs/blueprint-spec
#
# After deploy, set ORS_API_KEY in the backend service and point the frontend's
# VITE_API_BASE_URL at the backend URL.
services:
  - type: web
    name: weather-routing-api
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false # set to your backend host, e.g. weather-routing-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false # set to your frontend URL, e.g. https://weather-routing.onrender.com
      - key: ORS_API_KEY
        sync: false # paste your OpenRouteService key
      - key: SECURE_SSL_REDIRECT
        value: "True"

  - type: web
    name: weather-routing-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # set to the backend URL, e.g. https://weather-routing-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
